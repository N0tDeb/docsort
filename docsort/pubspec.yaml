name: docsort
description: "Flutter client for the DocSort intelligent document processing system."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cunning_document_scanner: 3.0.4
  cupertino_icons: 2.0.0
  dio: 5.11.1
  file_picker: 10.3.10
  fl_chart: 1.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 10.3.4
  go_router: 18.1.1
  jwt_decoder: 2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/docsort_logo.png"

name: Dependency review

on:
  pull_request:
    paths:
      - "docsort/pubspec.yaml"
      - "docsort/pubspec.lock"
      - "docsort-backend/requirements*.txt"
      - "docsort/android/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # GitHub's Dependency Review Action is available to public repositories.
    # Private organization repositories can remove this guard when GitHub
    # Advanced Security / dependency review is enabled for the repository.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

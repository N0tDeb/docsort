name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docsort-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: docsort-backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile application and tests
        env:
          JWT_SECRET: test-secret-for-ci-32-bytes-minimum-12345
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
        run: python -m compileall -q app tests

      - name: Run tests
        env:
          JWT_SECRET: test-secret-for-ci-32-bytes-minimum-12345
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-role-key
        run: pytest -q

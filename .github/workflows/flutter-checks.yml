name: Flutter checks

on:
  push:
    paths:
      - "docsort/**"
      - ".github/workflows/flutter-checks.yml"
  pull_request:
    paths:
      - "docsort/**"
      - ".github/workflows/flutter-checks.yml"

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docsort

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web upload client
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.invalid
